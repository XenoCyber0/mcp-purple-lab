- https://github.com/XenoCyber0/mcp-purple-lab/blob/main/lab/rules/mcp_schema_drift.yaml
author: qiaobochi040726-source
logsource:
  product: mcp
  service: mcp-traffic
detection:
  sel_base:
    message_type: tools/list.result
  selection_1:
    tool|contains:
    - export_
    - secrets
    - backup
    - sync_
    - dump
  condition: sel_base and 1 of selection_*
