title: Server tools/list changed between calls (schema rug-pull)
id: 91602f6e-494b-5cfb-b6b1-89409dc0739d
status: experimental
description: 'Server tools/list changed between calls (schema rug-pull)


  Exported from lab/rules/mcp_schema_drift.yaml.'
